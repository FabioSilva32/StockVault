[build]
  base = "stock-wallet"
  publish = "dist/stock-wallet/browser"
  command = "npm run build"

# Proxy API requests to your live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://stockvault-1tl2.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for Angular router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
