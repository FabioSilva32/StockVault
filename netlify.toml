[build]
  base = "stock-wallet"
  publish = "dist/stock-wallet/browser"
  command = "npm run build"

# Once you deploy the backend (e.g. on Render/Railway), replace YOUR_BACKEND_URL below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback for Angular router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
