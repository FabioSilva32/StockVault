<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Candlestick 1: Bullish Minor -->
  <line x1="20" y1="22" x2="20" y2="44" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
  <rect x="17" y="27" width="6" height="11" rx="2" fill="#0ea5e9"/>

  <!-- Candlestick 2: Bullish Major -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="28" y="21" width="8" height="20" rx="2.5" fill="url(#emeraldGrad)"/>

  <!-- Candlestick 3: Peak Candle -->
  <line x1="44" y1="18" x2="44" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <rect x="41" y="24" width="6" height="12" rx="2" fill="url(#cyanGrad)"/>

  <!-- Trend Overlay Line -->
  <path d="M14 42 L 28 30 L 40 22 L 52 16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="52" cy="16" r="3.5" fill="#38bdf8"/>
</svg>
